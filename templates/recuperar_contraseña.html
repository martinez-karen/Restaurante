<!DOCTYPE html>
<html lang="es-mx">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña -  Ambar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-secondary">

  <header class="bg-dark text-light py-3 shadow">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="text-warning fw-bold m-0">  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-fork-knife" viewBox="0 0 16 16">
  <path d="M13 .5c0-.276-.226-.506-.498-.465-1.703.257-2.94 2.012-3 8.462a.5.5 0 0 0 .498.5c.56.01 1 .13 1 1.003v5.5a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5zM4.25 0a.25.25 0 0 1 .25.25v5.122a.128.128 0 0 0 .256.006l.233-5.14A.25.25 0 0 1 5.24 0h.522a.25.25 0 0 1 .25.238l.233 5.14a.128.128 0 0 0 .256-.006V.25A.25.25 0 0 1 6.75 0h.29a.5.5 0 0 1 .498.458l.423 5.07a1.69 1.69 0 0 1-1.059 1.711l-.053.022a.92.92 0 0 0-.58.884L6.47 15a.971.971 0 1 1-1.942 0l.202-6.855a.92.92 0 0 0-.58-.884l-.053-.022a1.69 1.69 0 0 1-1.059-1.712L3.462.458A.5.5 0 0 1 3.96 0z"/>
</svg> -Ambar</h1>
      <nav class="d-flex flex-wrap align-items-center gap-3">
        <a href="/registro" class="text-light text-decoration-none">Registro</a>
        <a href="/" class="btn btn-warning">Iniciar Sesión</a>
      </nav>
    </div>
  </header>

  <main class="container my-5">
    <h2 class="text-center text-dark mb-4">Recuperación de contraseña</h2>

    <form method="POST" action="/recuperar" class="card shadow-sm p-4 mx-auto" style="max-width: 520px;">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-info">
            {{ messages[0] }}
          </div>
        {% endif %}
      {% endwith %}

      <div class="mb-3">
        <label for="email" class="form-label fw-bold">Correo electrónico</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="Escribe tu correo" required>
      </div>

      <div class="text-center mt-3">
        <button type="submit" class="btn btn-success px-4">
          <i class="bi bi-send"></i> Enviar enlace
        </button>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
