<!DOCTYPE html>
<html lang="es-mx">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña -  Ambar</title>

  <link rel="stylesheet" href="/static/css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="cafe">

      <h1 class="logo-title fw-bold m-5 text-1 text-center">Ambar</h1>

    


  <main class="container my-5">


    <form method="POST" action="/recuperar" class="card shadow-sm p-4 mx-auto" style="max-width: 520px;">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-info">
            {{ messages[0] }}
          </div>
        {% endif %}
      {% endwith %}
       <h2 class="text-center text-dark mb-4">Recuperación de contraseña</h2>

      <div class="mb-3">
        <label for="email" class="form-label fw-bold">Correo electrónico</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="Escribe tu correo" required>
      </div>

      <div class="text-center mt-3">
        <button type="submit" class="btn btn-secondary px-4">
          <i class="bi bi-send"></i> Enviar enlace
        </button>
      </div>
              <div class="text-center m-4">
          <a href="/registro" class="text-dark text-decoration-none m-3">Registro</a>
          <a href="/" class="text-dark text-decoration-none m-">Iniciar Sesión</a>
      </div>
    </form>
  </main>
  

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
