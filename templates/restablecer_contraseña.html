<!DOCTYPE html>
<html lang="es-mx">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña - Ambar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-secondary">

  <header class="bg-dark text-light py-3 shadow">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="text-warning fw-bold m-0">Ambar</h1>
      <a href="/" class="btn btn-warning">Iniciar Sesión</a>
    </div>
  </header>

  <main class="container my-5">
    <h2 class="text-center text-dark mb-4">Crear nueva contraseña</h2>

    <form method="POST" class="card shadow-sm p-4 mx-auto" style="max-width: 560px;">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-danger">
            {{ messages[0] }}
          </div>
        {% endif %}
      {% endwith %}

      <div class="mb-3">
        <label for="password" class="form-label fw-medium">Nueva contraseña</label>
        <input type="password" class="form-control" id="password" name="password" required
               placeholder="Crea una contraseña segura"
               pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
               title="Debe contener al menos un número, una mayúscula y tener mínimo 8 caracteres">
        <div class="form-text">
          Mínimo 8 caracteres, incluyendo mayúsculas, minúsculas y números.
        </div>
      </div>

      <div class="mb-3">
        <label for="confirmPassword" class="form-label fw-medium">Confirmar contraseña</label>
        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required
               placeholder="Repite tu contraseña">
      </div>

      <button type="submit" class="btn btn-success w-100">
        <i class="bi bi-shield-lock"></i> Actualizar contraseña
      </button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
