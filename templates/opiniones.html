<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opiniones - Ambar</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
        
<body class="bg-dark">

  {% include "_navbar.html" %}

  <main class="container my-5 flex-grow-1">
    <section class="card shadow border-0 p-4 mb-5">

      <h1 class="fw-bold text-center mb-4">
        Opiniones de nuestros usuarios
      </h1>

      <div class="card shadow-sm border-0 p-4">

        <div class="row g-4">

          <div class="col-md-12">

            <h4 class="text-center mb-4">
              Comentario nuevo
            </h4>

            <form method="post" action="{{ url_for('opiniones') }}">

              <div class="mb-3">

                <label for="nombre" class="form-label fw-semibold">
                  Tu nombre
                </label>

                <input type="text"
                  class="form-control"
                  id="nombre"
                  name="nombre"
                  value="{{ session.get('nombre_usuario', '') }}"
                  required>

              </div>

              <div class="mb-3">

                <label for="descripcion" class="form-label fw-semibold">
                  Opinion
                </label>

                <textarea class="form-control"
                  id="descripcion"
                  name="descripcion"
                  rows="5"
                  required></textarea>

              </div>

              <div class="mb-4">

                <label class="form-label fw-semibold d-block">
                  Calificacion
                </label>

                <div class="btn-group" role="group" aria-label="Calificacion">
                  {% for estrella in range(1, 6) %}
                    <input type="radio"
                      class="btn-check"
                      name="calificacion"
                      id="estrella{{ estrella }}"
                      value="{{ estrella }}"
                      {% if estrella == 5 %}checked{% endif %}>
                    <label class="btn btn-outline-warning" for="estrella{{ estrella }}">
                      {{ estrella }} <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-star-fill" viewBox="0 0 16 16">
  <path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z"/>
</svg>
                    </label>
                  {% endfor %}
                </div>

              </div>

              <div class="d-flex gap-2">

                <button type="reset"
                  class="btn btn-outline-secondary w-50" href="#">
                  Cancelar
                </button>

                <button type="submit"
                  class="btn btn-success w-50" href="#">
                  Agregar comentario
                </button>

              </div>

            </form>

          </div>

          </div>

        </div>

      </div>

    </section>
  </main>

  {% include "_footer.html" %}
</body>

</html>
